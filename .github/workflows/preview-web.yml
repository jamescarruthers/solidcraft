# A preview of the web app for testing a branch: builds apps/solidcraft-web and deploys it to
# GitHub Pages as an artifact (the app's wasm is over git's 100 MB file limit, so it cannot go on
# a branch). Needs Settings → Pages → Source = GitHub Actions, and this branch allowed in
# Settings → Environments → github-pages. The full site (book, release channels) is pages.yml.
name: Preview web app

on:
  push:
    branches: [claude/magical-noether-onos4g]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: preview-web
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  TRUNK_VERSION: v0.21.14

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install trunk
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSL "https://github.com/trunk-rs/trunk/releases/download/${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz" | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build the web app
        working-directory: apps/solidcraft-web
        run: trunk build --release --public-url ./
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    timeout-minutes: 40
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          # Pages can take more than the default 10 minutes to sync the app's 146 MB wasm.
          timeout: 1800000
